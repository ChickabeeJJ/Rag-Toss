<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e15">
  <meta name="description" content="Rag Toss - a ragdoll throwing duel. Pull back, let go and fling rubber chickens, anvils, beehives and 15 other things at an endless parade of ragdolls on floating islands.">
  <title>Rag Toss</title>
  <link rel="stylesheet" href="css/style.css?v=1">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="stage" aria-label="Game"></canvas>

  <!-- =============================== HUD =============================== -->
  <div id="hud" class="hidden">
    <div class="stage-chip" id="stageChip">
      <span class="chip-num" id="chipNum">1</span>
      <div class="chip-body">
        <b id="chipTitle">MEADOW</b>
        <div class="chip-sub"><span class="dots" id="stageDots"></span><span class="ic boss-ic" data-icon="crown" id="bossIc"></span></div>
      </div>
    </div>
    <div class="hud-mid" id="hudMid">
      <b id="hudKos">0</b>
      <span>KNOCKOUTS</span>
    </div>
    <div class="combo hidden" id="combo"><b id="comboNum">x2</b><span>STREAK</span><em id="comboBonus">+20% COINS</em></div>
    <div class="bossbar hidden" id="bossBar">
      <div class="boss-top"><span class="ic" data-icon="crown"></span><b id="bossName">BOSS</b><small id="bossTitle"></small></div>
      <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
    </div>
    <div class="hud-right">
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b id="hudCoins">0</b></div>
      <button class="round" id="btnPause" aria-label="Pause"><span class="ic" data-icon="pause"></span></button>
    </div>

    <div class="banner hidden" id="banner"><b id="bannerText">STAGE 1</b><span id="bannerSub"></span></div>

    <div class="vitals" id="vitals">
      <div class="vital hp"><span class="ic" data-icon="heart"></span><div class="track"><i id="hpFill"></i></div><b id="hpNum">100</b></div>
      <div class="vital sta" id="staRow"><span class="ic" data-icon="bolt"></span><div class="track"><i id="staFill"></i><u id="staNeed"></u></div><b id="staNum">100</b></div>
      <div class="perk-chips" id="perkRow"></div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="duckhint" id="duckHint"><kbd id="duckKey">S</kbd><span>HOLD TO DUCK</span></div>
    <button class="tb tb-duck" id="btnDuck"><span class="ic" data-icon="duck"></span><small>DUCK</small></button>

    <div class="coach hidden" id="coach"><div class="coach-vis" id="coachVis"></div><p id="coachText"></p></div>
  </div>

  <!-- =============================== HOME =============================== -->
  <section id="home" class="screen">
    <div class="home-panel">
      <h1 class="title"><span class="t1">RAG</span><span class="t2"><i>TOSS</i></span></h1>
      <div class="home-menu">
        <button class="btn primary big" id="btnPlay"><span class="ic" data-icon="play"></span><span class="bt"><b>PLAY</b><small id="playSub">HOW FAR CAN YOU GET?</small></span></button>
        <div class="btn-row duo">
          <button class="btn mode" id="btnShop"><span class="ic" data-icon="bag"></span><span class="bt"><b>STUFF</b><small id="shopSub">1 / 18 FOUND</small></span><i class="dot hidden" id="shopDot"></i></button>
          <button class="btn mode" id="btnUpgrades"><span class="ic" data-icon="up"></span><span class="bt"><b>UPGRADES</b><small id="upSub">GET STRONGER</small></span><i class="dot hidden" id="upDot"></i></button>
        </div>
        <div class="btn-row duo">
          <button class="btn tile" id="btnMissions"><span class="ic" data-icon="scroll"></span><b>MISSIONS</b><i class="dot hidden" id="missionDot"></i></button>
          <button class="btn tile" id="btnRank"><span class="ic" data-icon="trophy"></span><b>RANK</b></button>
        </div>
      </div>
      <div class="home-bag">
        <div class="bag-head"><span>YOUR BAG</span><button class="btn small" id="btnBag"><b>CHANGE</b></button></div>
        <div class="bag-row" id="homeBag"></div>
      </div>
      <div class="rank-strip" id="rankStrip"></div>
    </div>
    <div class="corner tr">
      <button class="pill streak hidden" id="streakChip"><span class="ic" data-icon="gift"></span><b>DAILY</b></button>
      <div class="pill"><span class="ic" data-icon="skull"></span><b id="homeBest">BEST 0</b></div>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
      <button class="round" id="btnSettings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
    </div>
    <div class="home-hint" id="homeHint"></div>
  </section>

  <!-- =============================== STUFF ============================== -->
  <section id="shop" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2>STUFF TO THROW</h2>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
    </header>
    <div class="shop">
      <div class="shop-side card">
        <div class="shop-preview" id="shopPreview"></div>
        <div class="preview-info" id="shopInfo"></div>
      </div>
      <div class="shop-main">
        <div class="bag-edit card">
          <span class="bag-label">YOUR BAG</span>
          <div class="bag-row" id="shopBag"></div>
          <small id="bagHint">PICK SOMETHING, THEN TAP A SLOT</small>
        </div>
        <div class="shop-grid card" id="shopGrid"></div>
      </div>
    </div>
  </section>

  <!-- ============================= UPGRADES ============================= -->
  <section id="upgrades" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2>UPGRADES</h2>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
    </header>
    <div class="up-list" id="upList"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
  <div id="rotate" class="hidden"><div><span class="ic" data-icon="rotate"></span><p>TURN YOUR DEVICE SIDEWAYS</p><button class="btn primary" id="btnRotateOk"><b>PLAY ANYWAY</b></button></div></div>

  <script src="js/util.js?v=1"></script>
  <script src="js/platform.js?v=1"></script>
  <script src="js/audio.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/progress.js?v=1"></script>
  <script src="js/items.js?v=1"></script>
  <script src="js/world.js?v=1"></script>
  <script src="js/ragdoll.js?v=1"></script>
  <script src="js/fx.js?v=1"></script>
  <script src="js/game.js?v=1"></script>
  <script src="js/icons.js?v=1"></script>
  <script src="js/ui.js?v=1"></script>
  <script src="js/main.js?v=1"></script>
</body>
</html>
