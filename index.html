<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e15">
  <meta name="description" content="Rag Toss - a ragdoll throwing duel. Pull back, let go and fling rubber chickens, anvils, beehives and 23 other things at an endless parade of ragdolls on floating islands.">
  <title>Rag Toss</title>
  <link rel="stylesheet" href="css/style.css?v=25">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="stage" aria-label="Game"></canvas>

  <!-- =============================== HUD =============================== -->
  <div id="hud" class="hidden">
    <div class="stage-chip" id="stageChip">
      <span class="chip-num" id="chipNum">1</span>
      <div class="chip-body">
        <b id="chipTitle">MEADOW</b>
      </div>
    </div>
    <div class="hud-mid" id="hudMid">
      <b id="hudKos">0</b>
      <span>KNOCKOUTS</span>
      <em id="hudBest" class="hidden"></em>
    </div>
    <div class="combo hidden" id="combo"><b id="comboNum">x2</b><span>STREAK</span><em id="comboBonus">+20% COINS</em><i class="pips" id="comboPips"></i></div>
    <div class="bounty hidden" id="bounty"></div>
    <div class="fever hidden" id="fever"><div class="fv-top"><b>FRENZY</b><span>FREE THROWS · DOUBLE COINS</span></div><div class="fv-track"><i id="feverFill"></i></div></div>
    <div class="fever stand hidden" id="stand"><div class="fv-top"><b>LAST STAND</b><span>LAND A HIT</span></div><div class="fv-track"><i id="standFill"></i></div></div>
    <div class="bossbar hidden" id="bossBar">
      <div class="boss-top"><span class="ic" data-icon="crown"></span><b id="bossName">BOSS</b></div>
      <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
    </div>
    <div class="hud-right">
      <div class="pill" id="coinPill"><span class="ic coin" data-icon="coin"></span><b id="hudCoins">0</b></div>
      <button class="round" id="btnPause" aria-label="Pause"><span class="ic" data-icon="pause"></span></button>
    </div>

    <div class="banner hidden" id="banner"><b id="bannerText">STAGE 1</b><span id="bannerSub"></span></div>

    <div class="vitals" id="vitals">
      <div class="vital hp"><span class="ic" data-icon="heart"></span><div class="track"><i id="hpFill"></i></div><b id="hpNum">100</b></div>
      <div class="vital sta" id="staRow"><span class="ic" data-icon="bolt"></span><div class="track"><i id="staFill"></i></div><b id="staNum">100</b></div>
      <div class="perk-chips" id="perkRow"></div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="duckhint" id="duckHint"><kbd id="duckKey">S</kbd><span>DUCK</span><em><span class="ic" data-icon="bolt"></span>5</em></div>
    <button class="tb tb-duck" id="btnDuck"><span class="ic" data-icon="duck"></span><small>DUCK</small></button>

    <div class="coach hidden" id="coach">
      <div class="tut-dots hidden" id="tutDots"></div>
      <div class="coach-row"><div class="coach-vis" id="coachVis"></div><div class="coach-txt"><p id="coachText"></p><small id="coachSub"></small></div></div>
      <button class="tut-skip hidden" id="tutSkip">SKIP<span class="ic" data-icon="next"></span></button>
    </div>
  </div>

  <!-- =============================== HOME =============================== -->
  <section id="home" class="screen">
    <div class="home-panel">
      <h1 class="title" aria-label="Rag Toss"><span class="t1" aria-hidden="true"><i style="--i:0">R</i><i style="--i:1">A</i><i style="--i:2">G</i></span><span class="t2" aria-hidden="true"><i>TOSS</i></span></h1>
      <div class="home-menu">
        <button class="btn primary big" id="btnPlay"><span class="ic" data-icon="play"></span><span class="bt"><b id="playTitle">PLAY</b><small id="playSub">HOW FAR CAN YOU GET?</small></span></button>
        <button class="btn small newrun hidden" id="btnNew"><span class="ic" data-icon="restart"></span><b>START A NEW RUN</b></button>
        <div class="btn-row duo">
          <button class="btn mode" id="btnShop"><span class="ic" data-icon="bag"></span><span class="bt"><b>STUFF</b><small id="shopSub">1 / 18 FOUND</small></span><i class="dot hidden" id="shopDot"></i></button>
          <button class="btn mode" id="btnUpgrades"><span class="ic" data-icon="up"></span><span class="bt"><b>UPGRADES</b><small id="upSub"></small></span><i class="dot hidden" id="upDot"></i></button>
        </div>
        <div class="btn-row duo">
          <button class="btn tile" id="btnMissions"><span class="ic" data-icon="scroll"></span><b>MISSIONS</b><i class="dot hidden" id="missionDot"></i></button>
          <button class="btn tile" id="btnRank"><span class="ic" data-icon="trophy"></span><b>RANK</b></button>
        </div>
      </div>
      <div class="home-bag">
        <div class="bag-head"><span>YOUR BAG</span><button class="btn small" id="btnBag"><b>CHANGE</b></button></div>
        <div class="bag-row" id="homeBag"></div>
      </div>
      <div class="rank-strip" id="rankStrip"></div>
    </div>
    <div class="corner tr">
      <div class="pill"><span class="ic" data-icon="skull"></span><b id="homeBest">BEST 0</b></div>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
      <button class="round" id="btnSettings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
    </div>
    <div class="home-hint" id="homeHint"></div>
    <a class="legal home-legal" href="privacy.html" target="_blank" rel="noopener">PRIVACY</a>
  </section>

  <!-- =============================== STUFF ============================== -->
  <section id="shop" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <nav class="seg" id="shopTabs"><button data-tab="items" class="active">THROWABLES</button><button data-tab="chars">CHARACTERS</button></nav>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
    </header>
    <div class="shop">
      <div class="shop-side card">
        <div class="shop-preview" id="shopPreview"></div>
        <div class="preview-info" id="shopInfo"></div>
      </div>
      <div class="shop-main">
        <div class="bag-edit card">
          <span class="bag-label">YOUR BAG</span>
          <div class="bag-row" id="shopBag"></div>
          <small id="bagHint"></small>
        </div>
        <div class="shop-grid card" id="shopGrid"></div>
      </div>
    </div>
  </section>

  <!-- ============================= UPGRADES ============================= -->
  <section id="upgrades" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2>UPGRADES</h2>
      <div class="pill"><span class="ic coin" data-icon="coin"></span><b class="coin-val">0</b></div>
    </header>
    <div class="up-list" id="upList"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
  <div id="rotate" class="hidden"><div><span class="ic" data-icon="rotate"></span><p>TURN YOUR DEVICE SIDEWAYS</p><button class="btn primary" id="btnRotateOk"><b>PLAY ANYWAY</b></button></div></div>

  <script src="js/util.js?v=3"></script>
  <script src="js/platform.js?v=3"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/data.js?v=9"></script>
  <script src="js/progress.js?v=5"></script>
  <script src="js/items.js?v=6"></script>
  <script src="js/world.js?v=3"></script>
  <script src="js/ragdoll.js?v=8"></script>
  <script src="js/fx.js?v=3"></script>
  <script src="js/game.js?v=21"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/ui.js?v=20"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
